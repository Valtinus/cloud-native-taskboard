apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jwt-signing-key
  namespace: taskboard
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: jwt-signing-key
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: jwt-signing-key
