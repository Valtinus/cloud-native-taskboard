# Reference manifests — Terraform in terraform/kubernetes.tf is the source of truth.
# These can be used for manual kubectl apply during development.
# Replace REGISTRY and IMAGE_TAG before use.
#
# REGISTRY = <region>-docker.pkg.dev/<project>/taskboard
# IMAGE_TAG = bootstrap | <git-sha>

apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: taskboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
    spec:
      containers:
        - name: users-service
          image: REGISTRY/users-service:IMAGE_TAG
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-signing-key
                  key: key
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
