name: OpenTofu

on:
  push:
    branches: [main]
    paths: ["terraform/**"]
  pull_request:
    branches: [main]
    paths: ["terraform/**"]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to confirm infrastructure changes'
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_github_repo: ${{ github.repository }}
  TF_VAR_state_bucket: ${{ vars.TOFU_STATE_BUCKET }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: tofu fmt check
        run: tofu fmt -check -recursive

      - name: tofu init
        run: tofu init -backend-config="bucket=${{ vars.TOFU_STATE_BUCKET }}"

      - name: tofu validate
        run: tofu validate

      - name: tofu plan
        id: plan
        run: tofu plan -out=tfplan

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### OpenTofu Plan
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Upload plan artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1

  apply:
    name: Apply
    needs: plan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'APPLY'
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: tofu init
        run: tofu init -backend-config="bucket=${{ vars.TOFU_STATE_BUCKET }}"

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/

      - name: tofu apply
        run: tofu apply -auto-approve tfplan
