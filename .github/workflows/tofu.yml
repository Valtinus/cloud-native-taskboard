name: OpenTofu

on:
  push:
    branches: [main]
    paths: ["terraform/**"]
  pull_request:
    branches: [main]
    paths: ["terraform/**"]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to confirm infrastructure changes'
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_github_repo: ${{ github.repository }}
  TF_VAR_state_bucket: ${{ vars.TOFU_STATE_BUCKET }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: tofu fmt check
        run: tofu fmt -check -recursive

      - name: tofu init
        run: tofu init -backend-config="bucket=${{ vars.TOFU_STATE_BUCKET }}"

      - name: tofu validate
        run: tofu validate

      - name: tofu plan
        id: plan
        run: tofu plan -out=tfplan

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### OpenTofu Plan
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Upload plan artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1

  apply:
    name: Apply
    needs: plan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'APPLY'
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: tofu init
        run: tofu init -backend-config="bucket=${{ vars.TOFU_STATE_BUCKET }}"

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/

      - name: tofu apply
        run: tofu apply -auto-approve tfplan

  bootstrap-manifests:
    name: Bootstrap manifests
    needs: apply
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'APPLY'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: tofu init
        working-directory: terraform
        run: tofu init -backend-config="bucket=${{ vars.TOFU_STATE_BUCKET }}"

      - name: Export Tofu outputs
        id: tofu
        working-directory: terraform
        run: |
          echo "registry=$(tofu output -raw artifact_registry_url)" >> $GITHUB_OUTPUT
          echo "db_host=$(tofu output -raw db_host)" >> $GITHUB_OUTPUT
          echo "project_id=$(tofu output -raw project_id)" >> $GITHUB_OUTPUT
          echo "cluster_name=$(tofu output -raw cluster_name)" >> $GITHUB_OUTPUT
          echo "cluster_region=$(tofu output -raw cluster_region)" >> $GITHUB_OUTPUT

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ steps.tofu.outputs.cluster_region }}-docker.pkg.dev --quiet

      - name: Build & push bootstrap images
        env:
          REGISTRY: ${{ steps.tofu.outputs.registry }}
        run: |
          for svc in users-service tasks-service api-gateway frontend; do
            docker build -t "${REGISTRY}/${svc}:bootstrap" "services/${svc}"
            docker push "${REGISTRY}/${svc}:bootstrap"
          done

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ steps.tofu.outputs.cluster_name }}
          location: ${{ steps.tofu.outputs.cluster_region }}

      - name: Apply k8s manifests
        env:
          REGISTRY: ${{ steps.tofu.outputs.registry }}
          DB_HOST: ${{ steps.tofu.outputs.db_host }}
          PROJECT_ID: ${{ steps.tofu.outputs.project_id }}
          CLUSTER_NAME: ${{ steps.tofu.outputs.cluster_name }}
          CLUSTER_REGION: ${{ steps.tofu.outputs.cluster_region }}
        run: |
          envsubst '${DB_HOST}' < k8s/configmap.yaml | kubectl apply -f -
          envsubst '${PROJECT_ID},${CLUSTER_NAME},${CLUSTER_REGION}' < k8s/cluster-secret-store.yaml | kubectl apply -f -
          envsubst '${REGISTRY}' < k8s/deployment-users-service.yaml | kubectl apply -f -
          envsubst '${REGISTRY}' < k8s/deployment-tasks-service.yaml | kubectl apply -f -
          envsubst '${REGISTRY}' < k8s/deployment-api-gateway.yaml | kubectl apply -f -
          envsubst '${REGISTRY}' < k8s/deployment-frontend.yaml | kubectl apply -f -
          kubectl apply -f k8s/external-secret-db-credentials.yaml
          kubectl apply -f k8s/external-secret-jwt-signing-key.yaml
          kubectl apply -f k8s/service-users-service.yaml
          kubectl apply -f k8s/service-tasks-service.yaml
          kubectl apply -f k8s/service-api-gateway.yaml
          kubectl apply -f k8s/service-frontend.yaml
          kubectl apply -f k8s/ingress.yaml
