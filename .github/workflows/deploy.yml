name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "k8s/**"

permissions:
  id-token: write
  contents: read

env:
  REGION: europe-west1
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGISTRY: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/taskboard
  CLUSTER: taskboard-cluster

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      users: ${{ steps.filter.outputs.users }}
      tasks: ${{ steps.filter.outputs.tasks }}
      gateway: ${{ steps.filter.outputs.gateway }}
      frontend: ${{ steps.filter.outputs.frontend }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            users:
              - 'services/users-service/**'
            tasks:
              - 'services/tasks-service/**'
            gateway:
              - 'services/api-gateway/**'
            frontend:
              - 'services/frontend/**'
            k8s:
              - 'k8s/**'

  test:
    needs: detect-changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: taskboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        include:
          - service: users-service
            changed: ${{ needs.detect-changes.outputs.users }}
          - service: tasks-service
            changed: ${{ needs.detect-changes.outputs.tasks }}
          - service: api-gateway
            changed: ${{ needs.detect-changes.outputs.gateway }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.changed == 'true'
      - name: Run Go tests
        if: matrix.changed == 'true'
        working-directory: services/${{ matrix.service }}
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_NAME: taskboard_test
          TEST_DB_USER: test
          TEST_DB_PASSWORD: test
        run: go test ./...

  build:
    needs: [detect-changes, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: users-service
            changed: ${{ needs.detect-changes.outputs.users }}
          - service: tasks-service
            changed: ${{ needs.detect-changes.outputs.tasks }}
          - service: api-gateway
            changed: ${{ needs.detect-changes.outputs.gateway }}
          - service: frontend
            changed: ${{ needs.detect-changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.changed == 'true'
      - name: Authenticate to GCP
        if: matrix.changed == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - name: Configure Docker for Artifact Registry
        if: matrix.changed == 'true'
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - name: Build & push image
        if: matrix.changed == 'true'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}"
          docker build -t "$IMAGE" services/${{ matrix.service }}
          docker push "$IMAGE"

  deploy:
    needs: [detect-changes, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: users-service
            changed: ${{ needs.detect-changes.outputs.users }}
          - service: tasks-service
            changed: ${{ needs.detect-changes.outputs.tasks }}
          - service: api-gateway
            changed: ${{ needs.detect-changes.outputs.gateway }}
          - service: frontend
            changed: ${{ needs.detect-changes.outputs.frontend }}
    steps:
      - name: Authenticate to GCP
        if: matrix.changed == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - name: Get GKE credentials
        if: matrix.changed == 'true'
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}
      - name: Deploy to GKE
        if: matrix.changed == 'true'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}"
          kubectl set image deployment/${{ matrix.service }} \
            ${{ matrix.service }}="$IMAGE" \
            -n taskboard
          kubectl rollout status deployment/${{ matrix.service }} \
            -n taskboard --timeout=5m

  sync-manifests:
    name: Sync k8s manifests
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.k8s == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: tofu init
        working-directory: terraform
        run: tofu init -backend-config="bucket=${{ vars.TOFU_STATE_BUCKET }}"
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_github_repo: ${{ github.repository }}
          TF_VAR_state_bucket: ${{ vars.TOFU_STATE_BUCKET }}

      - name: Export Tofu outputs
        id: tofu
        working-directory: terraform
        run: |
          echo "registry=$(tofu output -raw artifact_registry_url)" >> $GITHUB_OUTPUT
          echo "db_host=$(tofu output -raw db_host)" >> $GITHUB_OUTPUT
          echo "project_id=$(tofu output -raw project_id)" >> $GITHUB_OUTPUT
          echo "cluster_name=$(tofu output -raw cluster_name)" >> $GITHUB_OUTPUT
          echo "cluster_region=$(tofu output -raw cluster_region)" >> $GITHUB_OUTPUT

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ steps.tofu.outputs.cluster_name }}
          location: ${{ steps.tofu.outputs.cluster_region }}

      - name: Apply k8s manifests
        env:
          REGISTRY: ${{ steps.tofu.outputs.registry }}
          DB_HOST: ${{ steps.tofu.outputs.db_host }}
          PROJECT_ID: ${{ steps.tofu.outputs.project_id }}
          CLUSTER_NAME: ${{ steps.tofu.outputs.cluster_name }}
          CLUSTER_REGION: ${{ steps.tofu.outputs.cluster_region }}
        run: |
          envsubst '${DB_HOST}' < k8s/configmap.yaml | kubectl apply -f -
          envsubst '${PROJECT_ID},${CLUSTER_NAME},${CLUSTER_REGION}' < k8s/cluster-secret-store.yaml | kubectl apply -f -
          envsubst '${REGISTRY}' < k8s/deployment-users-service.yaml | kubectl apply -f -
          envsubst '${REGISTRY}' < k8s/deployment-tasks-service.yaml | kubectl apply -f -
          envsubst '${REGISTRY}' < k8s/deployment-api-gateway.yaml | kubectl apply -f -
          envsubst '${REGISTRY}' < k8s/deployment-frontend.yaml | kubectl apply -f -
          kubectl apply -f k8s/external-secret-db-credentials.yaml
          kubectl apply -f k8s/external-secret-jwt-signing-key.yaml
          kubectl apply -f k8s/service-users-service.yaml
          kubectl apply -f k8s/service-tasks-service.yaml
          kubectl apply -f k8s/service-api-gateway.yaml
          kubectl apply -f k8s/service-frontend.yaml
          kubectl apply -f k8s/ingress.yaml
