services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: app
      POSTGRES_PASSWORD: dev
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d taskboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  users-service:
    build: ./services/users-service
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: taskboard
      DB_USER: app
      DB_PASSWORD: dev
      JWT_SIGNING_KEY: dev-only-not-for-prod-please-rotate
    depends_on:
      postgres:
        condition: service_healthy

  tasks-service:
    build: ./services/tasks-service
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: taskboard
      DB_USER: app
      DB_PASSWORD: dev
      USERS_SERVICE_URL: http://users-service:8080
    depends_on:
      postgres:
        condition: service_healthy
      users-service:
        condition: service_started

  api-gateway:
    build: ./services/api-gateway
    environment:
      USERS_SERVICE_URL: http://users-service:8080
      TASKS_SERVICE_URL: http://tasks-service:8080
      JWT_SIGNING_KEY: dev-only-not-for-prod-please-rotate
    depends_on:
      - users-service
      - tasks-service

  frontend:
    build: ./services/frontend
    ports:
      - "8080:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
