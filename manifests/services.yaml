apiVersion: v1
kind: Service
metadata:
  name: users-service
  namespace: taskboard
spec:
  type: ClusterIP
  selector:
    app: users-service
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: tasks-service
  namespace: taskboard
spec:
  type: ClusterIP
  selector:
    app: tasks-service
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: taskboard
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: taskboard
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
