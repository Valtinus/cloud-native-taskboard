apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: taskboard-secrets
  namespace: taskboard
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/${PROJECT_ID}/secrets/db-password/versions/latest"
        path: "db-password"
      - resourceName: "projects/${PROJECT_ID}/secrets/jwt-signing-key/versions/latest"
        path: "jwt-signing-key"
